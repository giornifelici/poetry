<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giorni Felici — Poesie di Alessandro Giorni</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Josefin+Sans:wght@100;300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1a1209;
      --paper: #f5efe6;
      --sepia: #c8a87a;
      --rust: #8b3a2a;
      --sage: #7a8c72;
      --mist: #d4cfc8;
      --shadow: rgba(26,18,9,0.12);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'Cormorant Garamond', Georgia, serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* GRAIN TEXTURE OVERLAY */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
      opacity: 0.4;
    }

    /* HEADER */
    header {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem 2rem;
      overflow: hidden;
    }

    header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 80% 60% at 50% 40%, rgba(200,168,122,0.18) 0%, transparent 70%);
      pointer-events: none;
    }

    .header-ornament {
      font-family: 'Josefin Sans', sans-serif;
      font-weight: 100;
      font-size: 0.7rem;
      letter-spacing: 0.35em;
      color: var(--sepia);
      text-transform: uppercase;
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fadeUp 1s ease 0.3s forwards;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(3.5rem, 10vw, 8rem);
      line-height: 0.9;
      letter-spacing: -0.02em;
      color: var(--ink);
      opacity: 0;
      animation: fadeUp 1.2s ease 0.5s forwards;
    }

    h1 em {
      font-style: italic;
      color: var(--rust);
      display: block;
    }

    .header-sub {
      font-family: 'Josefin Sans', sans-serif;
      font-weight: 100;
      font-size: 0.8rem;
      letter-spacing: 0.4em;
      color: var(--ink);
      opacity: 0;
      margin-top: 2rem;
      animation: fadeUp 1s ease 0.9s forwards;
    }

    .header-count {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1rem;
      color: var(--sepia);
      margin-top: 3.5rem;
      opacity: 0;
      animation: fadeUp 1s ease 1.1s forwards;
    }

    .scroll-hint {
      position: absolute;
      bottom: 2.5rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      opacity: 0;
      animation: fadeUp 1s ease 1.5s forwards;
    }

    .scroll-hint span {
      font-family: 'Josefin Sans', sans-serif;
      font-weight: 100;
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      color: var(--sepia);
      text-transform: uppercase;
    }

    .scroll-line {
      width: 1px;
      height: 60px;
      background: linear-gradient(to bottom, var(--sepia), transparent);
      animation: scrollAnim 2s ease-in-out infinite 2s;
    }

    /* SEARCH + FILTERS */
    .controls {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(245,239,230,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--mist);
      padding: 1rem 2rem;
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .search-wrap {
      position: relative;
      flex: 1;
      min-width: 200px;
    }

    .search-wrap input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--mist);
      padding: 0.4rem 0;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      color: var(--ink);
      outline: none;
      transition: border-color 0.3s;
    }

    .search-wrap input::placeholder {
      color: var(--sepia);
      font-style: italic;
    }

    .search-wrap input:focus {
      border-bottom-color: var(--rust);
    }

    .filter-btns {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      font-family: 'Josefin Sans', sans-serif;
      font-weight: 300;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      background: transparent;
      border: 1px solid var(--mist);
      color: var(--ink);
      padding: 0.35rem 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover, .filter-btn.active {
      background: var(--ink);
      color: var(--paper);
      border-color: var(--ink);
    }

    .results-count {
      font-family: 'Josefin Sans', sans-serif;
      font-weight: 100;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      color: var(--sepia);
      white-space: nowrap;
    }

    /* GRID */
    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 4rem 2rem 6rem;
    }

    .grid {
      columns: 1;
      column-gap: 2rem;
    }

    @media (min-width: 680px) { .grid { columns: 2; } }
    @media (min-width: 1024px) { .grid { columns: 3; } }
    @media (min-width: 1300px) { .grid { columns: 4; } }

    /* POEM CARD */
    .poem-card {
      break-inside: avoid;
      margin-bottom: 2rem;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .poem-card:hover { transform: translateY(-3px); }

    .card-inner {
      background: white;
      border: 1px solid var(--mist);
      overflow: hidden;
      position: relative;
      box-shadow: 0 2px 20px var(--shadow);
      transition: box-shadow 0.3s ease;
    }

    .poem-card:hover .card-inner {
      box-shadow: 0 8px 40px rgba(26,18,9,0.18);
    }

    .card-img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      display: block;
      filter: sepia(25%) brightness(0.95);
      transition: filter 0.4s ease, transform 0.5s ease;
    }

    .poem-card:hover .card-img {
      filter: sepia(15%) brightness(1);
      transform: scale(1.02);
    }

    .card-img-placeholder {
      width: 100%;
      aspect-ratio: 4/3;
      background: linear-gradient(135deg, var(--mist) 0%, rgba(200,168,122,0.3) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-img-placeholder span {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 3rem;
      color: var(--sepia);
      opacity: 0.5;
    }

    .card-body {
      padding: 1.4rem 1.4rem 1.2rem;
    }

    .card-date {
      font-family: 'Josefin Sans', sans-serif;
      font-weight: 100;
      font-size: 0.6rem;
      letter-spacing: 0.25em;
      color: var(--sepia);
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .card-title {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      font-size: 1.3rem;
      line-height: 1.2;
      color: var(--ink);
      margin-bottom: 0.8rem;
    }

    .card-preview {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 0.9rem;
      line-height: 1.6;
      color: rgba(26,18,9,0.6);
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer {
      padding: 0.8rem 1.4rem;
      border-top: 1px solid var(--mist);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-read {
      font-family: 'Josefin Sans', sans-serif;
      font-weight: 300;
      font-size: 0.62rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--rust);
    }

    .card-lines {
      font-family: 'Josefin Sans', sans-serif;
      font-weight: 100;
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      color: var(--sepia);
    }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(26,18,9,0.75);
      z-index: 1000;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s ease, visibility 0.4s ease;
      overflow-y: auto;
    }

    .modal-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      background: var(--paper);
      max-width: 680px;
      width: 100%;
      margin: auto;
      position: relative;
      transform: translateY(30px);
      transition: transform 0.4s ease;
    }

    .modal-overlay.open .modal {
      transform: translateY(0);
    }

    .modal-img-wrap {
      width: 100%;
      max-height: 380px;
      overflow: hidden;
      position: relative;
    }

    .modal-img {
      width: 100%;
      height: 380px;
      object-fit: cover;
      filter: sepia(20%) brightness(0.9);
      display: block;
    }

    .modal-img-placeholder {
      width: 100%;
      height: 200px;
      background: linear-gradient(135deg, var(--mist) 0%, rgba(200,168,122,0.3) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-img-gradient {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 120px;
      background: linear-gradient(to bottom, transparent, var(--paper));
    }

    .modal-body {
      padding: 2.5rem 3rem 3rem;
    }

    @media (max-width: 520px) {
      .modal-body { padding: 1.5rem 1.5rem 2rem; }
    }

    .modal-meta {
      font-family: 'Josefin Sans', sans-serif;
      font-weight: 100;
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      color: var(--sepia);
      text-transform: uppercase;
      margin-bottom: 1.2rem;
    }

    .modal-title {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1.05;
      color: var(--ink);
      margin-bottom: 2.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--mist);
    }

    .modal-poem {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.15rem;
      line-height: 1.9;
      color: var(--ink);
      white-space: pre-line;
      font-style: italic;
    }

    .modal-source {
      margin-top: 2.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--mist);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: gap;
      gap: 1rem;
    }

    .modal-byline {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 0.85rem;
      color: var(--sepia);
    }

    .modal-link {
      font-family: 'Josefin Sans', sans-serif;
      font-weight: 300;
      font-size: 0.62rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--rust);
      text-decoration: none;
      border-bottom: 1px solid var(--rust);
      padding-bottom: 1px;
      transition: opacity 0.2s;
    }

    .modal-link:hover { opacity: 0.6; }

    .modal-close {
      position: absolute;
      top: 1.2rem;
      right: 1.2rem;
      background: rgba(26,18,9,0.6);
      border: none;
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      z-index: 10;
    }

    .modal-close:hover { background: var(--rust); }

    .modal-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(245,239,230,0.9);
      border: 1px solid var(--mist);
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1rem;
      color: var(--ink);
      transition: all 0.2s;
      z-index: 10;
    }

    .modal-nav:hover { background: var(--ink); color: var(--paper); }
    .modal-nav.prev { left: -20px; }
    .modal-nav.next { right: -20px; }

    /* EMPTY STATE */
    .empty {
      text-align: center;
      padding: 6rem 2rem;
      grid-column: 1/-1;
    }

    .empty p {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.5rem;
      color: var(--sepia);
    }

    /* FOOTER */
    footer {
      text-align: center;
      padding: 3rem 2rem;
      border-top: 1px solid var(--mist);
    }

    footer p {
      font-family: 'Josefin Sans', sans-serif;
      font-weight: 100;
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      color: var(--sepia);
      text-transform: uppercase;
    }

    footer a {
      color: var(--rust);
      text-decoration: none;
    }

    /* ANIMATIONS */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes scrollAnim {
      0%, 100% { opacity: 0.3; transform: scaleY(0.8); transform-origin: top; }
      50% { opacity: 1; transform: scaleY(1); }
    }

    .poem-card {
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.5s ease, transform 0.5s ease, box-shadow 0.3s ease;
    }

    .poem-card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .poem-card.hidden { display: none; }
  </style>
</head>
<body>

<header>
  <div class="header-ornament">Raccolta poetica completa</div>
  <h1>Giorni<em>Felici</em></h1>
  <p class="header-sub">Alessandro Giorni &mdash; Poesie 2025&ndash;2026</p>
  <p class="header-count" id="headerCount"></p>
  <div class="scroll-hint">
    <span>Scorri</span>
    <div class="scroll-line"></div>
  </div>
</header>

<div class="controls">
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="Cerca per titolo o versi…" autocomplete="off">
  </div>
  <div class="filter-btns">
    <button class="filter-btn active" data-filter="all">Tutte</button>
    <button class="filter-btn" data-filter="brevi">Brevi</button>
    <button class="filter-btn" data-filter="lunghe">Lunghe</button>
    <button class="filter-btn" data-filter="2026">2026</button>
    <button class="filter-btn" data-filter="2025">2025</button>
  </div>
  <span class="results-count" id="resultsCount"></span>
</div>

<main>
  <div class="grid" id="grid"></div>
</main>

<footer>
  <p>Tutte le poesie &copy; Alessandro Giorni &mdash; riproduzione riservata &mdash;
  <a href="https://giornifelici.wordpress.com" target="_blank">giornifelici.wordpress.com</a></p>
</footer>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <button class="modal-close" id="modalClose" title="Chiudi">✕</button>
    <button class="modal-nav prev" id="modalPrev">&#8592;</button>
    <button class="modal-nav next" id="modalNext">&#8594;</button>
    <div class="modal-img-wrap" id="modalImgWrap"></div>
    <div class="modal-body">
      <div class="modal-meta" id="modalMeta"></div>
      <h2 class="modal-title" id="modalTitle"></h2>
      <div class="modal-poem" id="modalPoem"></div>
      <div class="modal-source">
        <span class="modal-byline">By Alessandro Giorni — riproduzione riservata</span>
        <a class="modal-link" id="modalLink" href="#" target="_blank">Leggi sul blog ↗</a>
      </div>
    </div>
  </div>
</div>

<script src="poems_data.js"></script>
<script>
  // ── STATE ─────────────────────────────────────────────
  let filtered = [...POEMS];
  let currentIdx = 0;
  let activeFilter = 'all';
  let searchTerm = '';

  // ── HEADER COUNT ─────────────────────────────────────
  document.getElementById('headerCount').textContent =
    `${POEMS.length} poesie raccolte`;

  // ── BUILD GRID ───────────────────────────────────────
  function buildGrid() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';

    if (filtered.length === 0) {
      grid.innerHTML = `<div class="empty"><p>Nessuna poesia trovata.</p></div>`;
    }

    filtered.forEach((poem, i) => {
      const lines = poem.text.trim().split('\n').length;
      const preview = poem.text.trim().split('\n').slice(0, 5).join('\n');

      const card = document.createElement('article');
      card.className = 'poem-card';
      card.dataset.idx = i;
      card.innerHTML = `
        <div class="card-inner">
          <div style="overflow:hidden">
            <img class="card-img" src="${poem.image}"
              alt="${poem.title}"
              loading="lazy"
              onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
            <div class="card-img-placeholder" style="display:none">
              <span>✦</span>
            </div>
          </div>
          <div class="card-body">
            <div class="card-date">${poem.date}</div>
            <h2 class="card-title">${poem.title}</h2>
            <p class="card-preview">${preview}</p>
          </div>
          <div class="card-footer">
            <span class="card-read">Leggi</span>
            <span class="card-lines">${lines} versi</span>
          </div>
        </div>`;

      card.addEventListener('click', () => openModal(i));
      grid.appendChild(card);
    });

    document.getElementById('resultsCount').textContent =
      `${filtered.length} / ${POEMS.length}`;

    // Intersection observer for staggered reveal
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry, i) => {
        if (entry.isIntersecting) {
          setTimeout(() => entry.target.classList.add('visible'), i * 40);
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.05 });

    document.querySelectorAll('.poem-card').forEach(c => observer.observe(c));
  }

  // ── FILTER + SEARCH ──────────────────────────────────
  function applyFilters() {
    filtered = POEMS.filter(poem => {
      const matchSearch = !searchTerm ||
        poem.title.toLowerCase().includes(searchTerm) ||
        poem.text.toLowerCase().includes(searchTerm) ||
        poem.date.toLowerCase().includes(searchTerm);

      const lines = poem.text.trim().split('\n').length;
      const matchFilter =
        activeFilter === 'all' ||
        (activeFilter === 'brevi' && lines <= 12) ||
        (activeFilter === 'lunghe' && lines > 20) ||
        (activeFilter === '2026' && poem.date.includes('2026')) ||
        (activeFilter === '2025' && poem.date.includes('2025'));

      return matchSearch && matchFilter;
    });
    buildGrid();
  }

  document.getElementById('searchInput').addEventListener('input', e => {
    searchTerm = e.target.value.toLowerCase().trim();
    applyFilters();
  });

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.filter;
      applyFilters();
    });
  });

  // ── MODAL ────────────────────────────────────────────
  function openModal(filteredIdx) {
    currentIdx = filteredIdx;
    renderModal();
    document.getElementById('modalOverlay').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
    document.body.style.overflow = '';
  }

  function renderModal() {
    const poem = filtered[currentIdx];
    if (!poem) return;

    // Image
    const wrap = document.getElementById('modalImgWrap');
    wrap.innerHTML = `
      <img class="modal-img" src="${poem.image}" alt="${poem.title}"
        onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
      <div class="modal-img-placeholder" style="display:none">
        <span style="font-family:Cormorant Garamond;font-style:italic;font-size:4rem;color:var(--sepia);opacity:.4">✦</span>
      </div>
      <div class="modal-img-gradient"></div>`;

    document.getElementById('modalMeta').textContent = poem.date;
    document.getElementById('modalTitle').textContent = poem.title;
    document.getElementById('modalPoem').textContent = poem.text;
    document.getElementById('modalLink').href = poem.url;

    // Nav
    document.getElementById('modalPrev').style.display = currentIdx > 0 ? 'flex' : 'none';
    document.getElementById('modalNext').style.display = currentIdx < filtered.length - 1 ? 'flex' : 'none';

    // Scroll to top of modal
    document.getElementById('modal').scrollIntoView({ behavior: 'instant', block: 'start' });
    document.getElementById('modalOverlay').scrollTop = 0;
  }

  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modalOverlay')) closeModal();
  });
  document.getElementById('modalPrev').addEventListener('click', () => {
    if (currentIdx > 0) { currentIdx--; renderModal(); }
  });
  document.getElementById('modalNext').addEventListener('click', () => {
    if (currentIdx < filtered.length - 1) { currentIdx++; renderModal(); }
  });

  // Keyboard navigation
  document.addEventListener('keydown', e => {
    if (!document.getElementById('modalOverlay').classList.contains('open')) return;
    if (e.key === 'Escape') closeModal();
    if (e.key === 'ArrowLeft' && currentIdx > 0) { currentIdx--; renderModal(); }
    if (e.key === 'ArrowRight' && currentIdx < filtered.length - 1) { currentIdx++; renderModal(); }
  });

  // ── INIT ─────────────────────────────────────────────
  buildGrid();
</script>
</body>
</html>
